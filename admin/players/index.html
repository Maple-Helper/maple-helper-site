<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שחקני Maple Helper (0.18.1+)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/players/players.js" defer></script>
</head>
<body>

<!-- ============================================================ sign in -->
<main id="login" class="login" hidden>
  <form id="login-form" class="card login-card" autocomplete="on">
    <img src="/assets/img/icon-64.png" width="48" height="48" alt="">
    <h1 data-i18n="title">שחקני Maple Helper (0.18.1+)</h1>
    <p class="muted" data-i18n="managers_only">למנהלי האתר בלבד.</p>
    <label for="password" data-i18n="password">סיסמה</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required minlength="12">
    <button type="submit" class="btn" data-i18n="sign_in">כניסה</button>
    <button type="button" class="link lang-btn">English</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</main>

<!-- ============================================================ page -->
<div id="app" hidden>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/admin/" title="maplehelper.app/admin">
        <img src="/assets/img/icon-64.png" width="28" height="28" alt="">
        <span>Maple Helper <b data-i18n="page_title">שחקנים</b></span>
      </a>
      <div class="top-actions">
        <span id="updated" class="muted small" aria-live="polite"></span>
        <label class="small auto"><input type="checkbox" id="auto" checked> <span data-i18n="auto_refresh">רענון אוטומטי</span></label>
        <a class="btn ghost" href="/admin/" data-i18n="full_dashboard">הדשבורד המלא</a>
        <button class="btn ghost lang-btn" type="button">English</button>
        <button id="refresh" class="btn ghost" type="button" data-i18n="refresh">רענון</button>
        <button id="logout" class="btn ghost" type="button" data-i18n="sign_out">יציאה</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="notices"></div>

    <section aria-labelledby="h-players">
      <h2 id="h-players"><span data-i18n="page_title">שחקנים</span> <span class="src" data-i18n="page_src"></span></h2>
      <p id="since" class="note"></p>
      <details class="card how"><summary data-i18n="how_counted">איך זה נספר</summary><p class="note" data-i18n-html="note"></p></details>
      <div class="tiles hero-tiles" id="now-tiles"></div>
      <div class="tiles" id="tiles"></div>
      <div class="grid2" id="charts"></div>
      <div class="grid3" id="lists"></div>
    </section>

    <section aria-labelledby="h-feed">
      <h2 id="h-feed"><span data-i18n="recent">פעילות אחרונה</span> <span class="src" data-i18n="last24"></span></h2>
      <div class="card"><div id="feed"></div></div>
    </section>
  </main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</div>

<noscript><p class="wrap">The page needs JavaScript.</p></noscript>
</body>
</html>
